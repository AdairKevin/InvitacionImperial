<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitacion Imperial</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  </head>
  <body class="center">
    <!-- Todos los textos, fotos y links se editan en contenido.json; aquí solo van variables -->
    <template id="plantilla">
    <div class="content">
      <!-- Header-->
      <section class="header">
        <img src="{{portada.foto}}" alt="{{portada.fotoAlt}}" class="hero-img">
        <div class="overlay">
          <h3 class="titulo">{{portada.evento}}</h3>
          <h1 class="fecha">{{portada.fecha}}</h1>
        </div>

        <div class="musica">
          <button class="play-button" id="playPauseBtn">▶</button>

          <audio id="audioPlayer" src="{{portada.musica}}"></audio>
        </div>

        <div class="container-info">
          <h2 class="nombres">{{portada.nombres}}</h2>

          <p class="frase">{{portada.frase}}</p>

          <div class="contador">
            <section>
              <table align="center" width="90%">
                <tbody><tr>
                  <td><span id="days"></span></td>
                  <td><span id="hours"></span></td>
                  <td><span id="minutes"></span></td>
                  <td><span id="seconds"></span></td>
                </tr>
                <tr>
                  <th>{{cuentaRegresiva.dias}}</th>
                  <th>{{cuentaRegresiva.horas}}</th>
                  <th>{{cuentaRegresiva.minutos}}</th>
                  <th>{{cuentaRegresiva.segundos}}</th>
                </tr>
              </tbody></table>
            </section>
          </div>

          <div class="separador">
            <img src="{{portada.separador}}" alt="">
          </div>

          <div class="titulo-padres">{{portada.tituloPadres}}</div>

          <div class="info-secundary">
            {{#portada.familia}}
            <div class="info-content">
              <h1>{{titulo}}</h1>
              <ul>
                <li>{{nombre1}}</li>
                <li>{{nombre2}}</li>
              </ul>
            </div>
            {{/portada.familia}}
            
          </div>

          <div class="titulo-padres">{{portada.tituloPadrinos}}</div>
          <div class="padrinos">
            <ul>
              {{#portada.padrinos}}
              <li>{{.}}</li>
              {{/portada.padrinos}}
              
            </ul>
          </div>
        </div>
      </section>

      <div class="divisor-imagen">
        <img src="{{fotoDivisora1.foto}}" alt="">
      </div>

      <!-- DRESS CODE -->
      <section class="dresscode">
        <h3>{{vestimenta.titulo}}</h3>
        <h4>{{vestimenta.codigo}}</h4>
        <p>{{vestimenta.texto}}</p>
        <div class="palette">
          {{#vestimenta.colores}}<span class="color" style="background: {{.}}"></span>
          {{/vestimenta.colores}}</div>
      </section>

      <!-- DETALLES DE LA BODA -->
      <section class="details">
        <div class="event-info">
          <h3>{{ubicaciones.ceremoniaTitulo}}</h3>
          <h4>{{ubicaciones.ceremoniaLugar}}</h4>
          <p>{{ubicaciones.ceremoniaDireccion}}</p>
          <button class="btnUbicacion"><a href="{{ubicaciones.ceremoniaMapa}}">{{ubicaciones.ceremoniaBoton}}</a></button>
        </div>
      </section>

      <section class="details">
        <div class="event-info">
          <h3>{{ubicaciones.recepcionTitulo}}</h3>
          <h4>{{ubicaciones.recepcionLugar}}</h4>
          <p>{{ubicaciones.recepcionDireccion}}</p>
          <button class="btnUbicacion"><a href="{{ubicaciones.recepcionMapa}}">{{ubicaciones.recepcionBoton}}</a></button>
        </div>
      </section>

      <div class="divisor-imagen1">
        <img src="{{fotoDivisora2.foto}}" alt="">
      </div>

      <section class="container-info-2">
        <div class="mesa-regalos">
          <h3>{{regalos.titulo}}</h3>
          <p>{{regalos.texto}}</p>
          <h4>{{regalos.cuenta}}</h4>
        </div>

        <div class="separador">
          <img src="{{regalos.separador}}" alt="">
        </div>

        <!-- Confirmacion-->
        <section class="confirmar">
          <h2 class="confirmar-titulo">{{confirmacion.frase}}</h2>
          <p>{{confirmacion.agradecimiento}}</p>
          <button class="btnConfirmar">
            <a href="{{confirmacion.link}}">{{confirmacion.boton}}</a>
          </button>
        </section>
      </section>

      <!-- Footer -->
      <footer>
        {{footer.texto}}
        <a href="{{footer.link}}" target="_blank">{{footer.marca}}</a>
        {{footer.anio}}
      </footer>
    </div>

      <script src="assets/js/main.js"></script>
    </template>

    <script src="assets/js/motor.js"></script>
  </body>
</html>
